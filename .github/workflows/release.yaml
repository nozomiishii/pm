name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

# デフォルト権限を無効化し、各ジョブで必要最小限の権限のみ付与する
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write # required by release-please-action to create release commits, tags, and GitHub Releases
      issues: write # kept to match release-please's documented permission set (avoids divergence-debugging later)
      pull-requests: write # required by release-please-action to open and update the release PR

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false # zizmor cache-poisoning 対策

      - name: Load secrets from 1Password
        id: secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: op://nozomiishii-release/github-app/username
          APP_PRIVATE_KEY: op://nozomiishii-release/github-app/credential

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write # kept to match release-please's documented permission set (avoids divergence-debugging later)
          permission-pull-requests: write
          # GitHub requires workflows:write to create a release/tag on a commit that is
          # not the current branch head. release-please tags the (already-merged, now
          # non-head) release commit, so without this the create-release call returns
          # 403 "Resource not accessible by integration".
          permission-workflows: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/.release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  build-and-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # macOS runner required: tsdown ad-hoc signs darwin binaries via `codesign`, which
    # exists only on macOS. On Linux it downgrades the failure to a warning and ships
    # unsigned binaries that Apple Silicon kills on exec. Linux targets cross-build here.
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write # required by gh release upload to attach built binaries to the GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the released tag, not the run's trigger commit: with rapid merges the
          # release-creating run may predate the version bump and publish a stale version.
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build binaries
        run: pnpm run build:exe

      - name: Rename binaries
        run: |
          mv build/cli-darwin-x64 build/pm-darwin-x64
          mv build/cli-darwin-arm64 build/pm-darwin-arm64
          mv build/cli-linux-x64 build/pm-linux-x64
          mv build/cli-linux-arm64 build/pm-linux-arm64

      - name: Verify darwin binaries are signed
        run: |
          codesign --verify build/pm-darwin-x64
          codesign --verify build/pm-darwin-arm64

      - name: Copy release assets
        run: |
          cp src/pm.zsh build/pm.zsh
          cp src/logo/logo-color.ascii build/logo-color.ascii

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" build/*

  npm-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # required by actions/checkout to fetch repository code
      id-token: write # required by npm publish for OIDC-based trusted publishing to the npm registry

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the released tag, not the run's trigger commit: with rapid merges the
          # release-creating run may predate the version bump and publish a stale version.
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: pnpm install

      - name: Publish to npm
        run: pnpm publish --no-git-checks
